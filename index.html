<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Rockstarov</title>
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold:       #c9a84c;
      --gold-light: #f0d080;
      --gold-dim:   #7a5f28;
      --black:      #080808;
      --card-bg:    rgba(10, 9, 6, 0.72);
      --border:     rgba(201, 168, 76, 0.25);
    }

    html, body {
      width: 100%; height: 100%;
      background: var(--black);
      font-family: 'Onest', sans-serif;
      overflow-x: hidden;
      overflow-y: auto;
    }

    /* ── Canvas ── */
    #sky {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    /* ── Shooting stars ── */
    .shoot {
      position: fixed;
      width: 120px; height: 1px;
      background: linear-gradient(90deg, rgba(240,208,128,0) 0%, #f0d080 100%);
      border-radius: 9999px;
      z-index: 1;
      opacity: 0;
      transform-origin: right center;
      animation: shoot 3s ease-in infinite;
    }
    @keyframes shoot {
      0%   { opacity: 0; transform: translateX(0) rotate(var(--a)); }
      5%   { opacity: 1; }
      60%  { opacity: 0; }
      100% { opacity: 0; transform: translateX(-600px) rotate(var(--a)); }
    }

    /* ── Page layout ── */
    #page {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100%;
      width: 100%;
      padding: 40px 16px;
    }

    /* ── Card ── */
    .card {
      width: min(300px, 86vw);
      padding: 28px 24px 24px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow:
        0 0 0 1px rgba(201,168,76,.08),
        0 8px 48px rgba(0,0,0,.7),
        inset 0 1px 0 rgba(201,168,76,.15);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      animation: rise .9s cubic-bezier(.22,1,.36,1) both;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(28px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Avatar ── */
    .avatar-wrap {
      position: relative;
      width: 78px; height: 78px;
      margin-bottom: 14px;
    }
    .avatar-wrap::before {
      content: '';
      position: absolute;
      inset: -3px;
      border-radius: 50%;
      background: conic-gradient(
        var(--gold-light) 0deg,
        var(--gold-dim)  120deg,
        var(--gold-light) 240deg,
        var(--gold-dim)  360deg
      );
      animation: spin 6s linear infinite;
      z-index: 0;
    }
    .avatar-wrap::after {
      content: '';
      position: absolute;
      inset: -8px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(201,168,76,.18) 0%, transparent 70%);
      z-index: -1;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .avatar {
      position: relative;
      z-index: 1;
      width: 78px; height: 78px;
      border-radius: 50%;
      border: 3px solid var(--black);
      object-fit: cover;
      display: block;
    }

    /* placeholder if no photo */
    .avatar-placeholder {
      position: relative;
      z-index: 1;
      width: 78px; height: 78px;
      border-radius: 50%;
      border: 3px solid var(--black);
      background: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      color: var(--gold);
    }

    /* ── Name ── */
    .name {
      font-family: 'Onest', sans-serif;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: .04em;
      color: var(--gold-light);
      text-align: center;
      line-height: 1.2;
    }
    .handle {
      font-size: 12px;
      font-weight: 300;
      letter-spacing: .18em;
      color: var(--gold-dim);
      text-transform: uppercase;
      margin-top: 4px;
      margin-bottom: 20px;
      text-align: center;
    }

    /* ── Divider ── */
    .divider {
      width: 100%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--border), transparent);
      margin-bottom: 24px;
    }

    /* ── Buttons ── */
    .links {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .btn {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      padding: 10px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: rgba(201,168,76,.05);
      color: #e8d89a;
      text-decoration: none;
      font-family: 'Onest', sans-serif;
      font-size: 13px;
      font-weight: 400;
      letter-spacing: .06em;
      transition: background .22s, border-color .22s, transform .18s, box-shadow .22s;
      cursor: pointer;
    }
    .btn:hover {
      background: rgba(201,168,76,.13);
      border-color: rgba(201,168,76,.5);
      transform: translateY(-2px);
      box-shadow: 0 6px 24px rgba(201,168,76,.12);
    }
    .btn:active { transform: translateY(0); }

    .btn-icon {
      width: 32px; height: 32px;
      border-radius: 8px;
      background: rgba(201,168,76,.1);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .btn-icon svg {
      width: 18px; height: 18px;
      fill: var(--gold);
    }

    .btn-text { flex: 1; }
    .btn-label {
      display: block;
      font-size: 11px;
      color: var(--gold-dim);
      letter-spacing: .1em;
      text-transform: uppercase;
      margin-bottom: 1px;
    }
    .btn-title { font-size: 13.5px; color: #e8d89a; }

    .btn-arrow {
      opacity: .4;
      font-size: 16px;
      color: var(--gold);
    }

    /* ── Footer ── */
    .footer {
      margin-top: 16px;
      font-size: 10px;
      letter-spacing: .14em;
      color: rgba(201,168,76,.25);
      text-transform: uppercase;
    }
  </style>
</head>
<body>

<canvas id="sky"></canvas>

<!-- shooting stars -->
<div class="shoot" style="top:18%; right:10%; --a:-25deg; animation-delay:0s;"></div>
<div class="shoot" style="top:42%; right:25%; --a:-15deg; animation-delay:2.1s;"></div>
<div class="shoot" style="top:8%;  right:40%; --a:-30deg; animation-delay:4.7s;"></div>
<div class="shoot" style="top:65%; right:5%;  --a:-20deg; animation-delay:7s;"></div>
<div class="shoot" style="top:30%; right:60%; --a:-10deg; animation-delay:9.3s;"></div>

<div id="page">
  <div class="card">

    <!-- Avatar -->
    <div class="avatar-wrap">
      <!--
        Чтобы добавить свою аватарку замени строку ниже на:
        <img class="avatar" src="avatar.jpg" alt="avatar" />
        и положи файл avatar.jpg рядом с index.html
      -->
      <div class="avatar-placeholder">★</div>
    </div>

    <div class="name">Rockstarov</div>
    <div class="handle">@IRockstarov</div>

    <div class="divider"></div>

    <div class="links">

      <!-- Профиль -->
      <a class="btn" href="https://t.me/IRockstarov" target="_blank" rel="noopener">
        <div class="btn-icon">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2C6.477 2 2 6.477 2 12s4.477 10 10 10 10-4.477 10-10S17.523 2 12 2zm4.93 6.58-1.87 8.82c-.14.62-.51.77-.99.48l-2.74-2.02-1.32 1.27c-.15.15-.27.27-.55.27l.19-2.79 5.02-4.54c.22-.19-.05-.3-.33-.11l-6.2 3.9-2.67-.83c-.58-.18-.59-.58.12-.86l10.41-4.01c.49-.18.91.11.76.42z"/>
          </svg>
        </div>
        <div class="btn-text">
          <span class="btn-label">Профиль</span>
          <span class="btn-title">@IRockstarov</span>
        </div>
        <span class="btn-arrow">›</span>
      </a>

      <!-- Канал -->
      <a class="btn" href="https://t.me/wibecoderplugins" target="_blank" rel="noopener">
        <div class="btn-icon">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2C6.477 2 2 6.477 2 12s4.477 10 10 10 10-4.477 10-10S17.523 2 12 2zm4.93 6.58-1.87 8.82c-.14.62-.51.77-.99.48l-2.74-2.02-1.32 1.27c-.15.15-.27.27-.55.27l.19-2.79 5.02-4.54c.22-.19-.05-.3-.33-.11l-6.2 3.9-2.67-.83c-.58-.18-.59-.58.12-.86l10.41-4.01c.49-.18.91.11.76.42z"/>
          </svg>
        </div>
        <div class="btn-text">
          <span class="btn-label">Канал</span>
          <span class="btn-title">WibeCoder Plugins</span>
        </div>
        <span class="btn-arrow">›</span>
      </a>

      <!-- Чат -->
      <a class="btn" href="https://t.me/afewagoodmen" target="_blank" rel="noopener">
        <div class="btn-icon">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-2 12H6v-2h12v2zm0-3H6V9h12v2zm0-3H6V6h12v2z"/>
          </svg>
        </div>
        <div class="btn-text">
          <span class="btn-label">Чат</span>
          <span class="btn-title">Чат</span>
        </div>
        <span class="btn-arrow">›</span>
      </a>

    </div>

    <div class="footer">rockstarov &nbsp;·&nbsp; 2026</div>
  </div>
</div>

<script>
  /* ── Starfield ── */
  const canvas = document.getElementById('sky');
  const ctx    = canvas.getContext('2d');

  let W, H, stars = [];

  const GOLD_PALETTE = [
    [255, 245, 200],
    [240, 208, 128],
    [201, 168,  76],
    [255, 255, 255],
    [255, 230, 150],
  ];

  function rand(a, b) { return a + Math.random() * (b - a); }

  function resize() {
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
    buildStars();
  }

  function buildStars() {
    const count = Math.floor((W * H) / 3200);
    stars = Array.from({ length: count }, () => {
      const col = GOLD_PALETTE[Math.floor(Math.random() * GOLD_PALETTE.length)];
      return {
        x:    rand(0, W),
        y:    rand(0, H),
        r:    rand(.2, 1.4),
        col,
        base: rand(.15, .85),
        spd:  rand(.4, 1.6),
        ph:   rand(0, Math.PI * 2),
      };
    });
  }

  function draw(t) {
    ctx.clearRect(0, 0, W, H);

    /* deep space gradient */
    const grad = ctx.createRadialGradient(W*.5, H*.5, 0, W*.5, H*.5, Math.max(W,H)*.7);
    grad.addColorStop(0,   'rgba(18,14, 5,.98)');
    grad.addColorStop(.55, 'rgba(6, 5, 2,.99)');
    grad.addColorStop(1,   'rgba(0, 0, 0,1)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    /* subtle golden nebula */
    const neb = ctx.createRadialGradient(W*.65, H*.3, 0, W*.65, H*.3, W*.35);
    neb.addColorStop(0,   'rgba(120,85,20,.06)');
    neb.addColorStop(.5,  'rgba(80, 55,10,.03)');
    neb.addColorStop(1,   'rgba(0,  0, 0,0)');
    ctx.fillStyle = neb;
    ctx.fillRect(0, 0, W, H);

    /* stars */
    stars.forEach(s => {
      const flicker = s.base + .15 * Math.sin(t * .001 * s.spd + s.ph);
      const [r,g,b] = s.col;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${r},${g},${b},${Math.min(1, flicker)})`;
      ctx.fill();

      /* glow on bigger stars */
      if (s.r > .9) {
        const glow = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.r * 5);
        glow.addColorStop(0,   `rgba(${r},${g},${b},${flicker * .35})`);
        glow.addColorStop(1,   `rgba(${r},${g},${b},0)`);
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r * 5, 0, Math.PI * 2);
        ctx.fillStyle = glow;
        ctx.fill();
      }
    });

    requestAnimationFrame(draw);
  }

  window.addEventListener('resize', resize);
  resize();
  requestAnimationFrame(draw);
</script>
</body>
</html>
